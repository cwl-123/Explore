name: Deploy Explore

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-explore
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" 'bash --noprofile --norc -s' <<'REMOTE'
          set -e
          echo "HOME=$HOME"
          REPO=""
          while IFS= read -r g; do
            d=$(dirname "$g")
            if git -C "$d" remote -v 2>/dev/null | grep -q 'cwl-123/Explore'; then
              REPO="$d"
              break
            fi
          done < <(find "$HOME" /var/www /srv /opt -maxdepth 4 -type d -name .git 2>/dev/null)
          if [ -z "$REPO" ]; then
            echo "ERROR: Explore repo not found"
            exit 1
          fi
          echo "REPO=$REPO"
          cd "$REPO"
          git fetch origin master
          git reset --hard origin/master
          echo "DEPLOYED $(git rev-parse --short HEAD)"
          REMOTE
